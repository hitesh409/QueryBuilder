
<div class="login-container">
    <div class="avatar">
        <i class="material-icons profile">person</i>
    </div>
    <div class="form-container">
        
        <form (ngSubmit)="onSubmit()">
            <div class="form-group">
                <i class="material-icons login-avatar">mail</i>
                <input type="email" class="form-control" id="email" [(ngModel)]="loginModel.email" name="email" placeholder="Email" required>
            </div>
            <div class="form-group">
                <i class="material-icons login-avatar">key</i>
                <input type="password" class="form-control" id="password" [(ngModel)]="loginModel.password" name="password" placeholder="Password" required>
            </div>
            <div class="form-group">
                <button type="submit" class="btn btn-primary">Login</button>
            </div>
            <div *ngIf="errorMessage" class="alert alert-danger">{{ errorMessage }}</div>
        </form>
    </div>
</div>
